
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Espaço — Demonstração</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafd;
      color: #202124;
    }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      background: white;
      border-bottom: 1px solid #ddd;
    }
    header strong { font-size: 21px; }
    input {
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 24px;
      width: min(100%, 450px);
      background: #f1f3f4;
    }
    .aviso {
      background: #e8f0fe;
      padding: 12px 24px;
      font-size: 14px;
    }
    .layout { display: flex; min-height: 80vh; }
    aside {
      width: 210px;
      padding: 20px 12px;
      flex-shrink: 0;
    }
    aside button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 13px;
      border: 0;
      border-radius: 20px;
      background: transparent;
      cursor: pointer;
    }
    aside button:hover { background: #e8eaed; }
    main { padding: 24px; flex: 1; min-width: 0; }
    h2 { font-size: 20px; font-weight: 500; }
    .arquivos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
    }
    .arquivo {
      background: white;
      border: 1px solid #dadce0;
      border-radius: 12px;
      padding: 18px;
      min-height: 95px;
    }
    .arquivo span { display: block; margin-bottom: 12px; font-size: 25px; }
    .arquivo p { margin: 0; overflow-wrap: anywhere; }
    @media (max-width: 600px) {
      header { padding: 12px; flex-wrap: wrap; }
      aside { width: 110px; }
      main { padding: 14px; }
      .arquivos { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <strong>📁 Meu Espaço</strong>
    <input id="busca" placeholder="Pesquisar arquivos de demonstração...">
  </header>

  <div class="aviso">
    Projeto demonstrativo independente. Não é o Google Drive e não coleta dados pessoais.
  </div>

  <div class="layout">
    <aside>
      <button onclick="mostrar('Todos os arquivos')">📂 Meus arquivos</button>
      <button onclick="mostrar('Favoritos')">⭐ Favoritos</button>
      <button onclick="mostrar('Recentes')">🕘 Recentes</button>
    </aside>

    <main>
      <h2 id="titulo">Meus arquivos</h2>
      <div class="arquivos" id="lista">
        <div class="arquivo"><span>📁</span><p>Projetos</p></div>
        <div class="arquivo"><span>📁</span><p>Documentos</p></div>
        <div class="arquivo"><span>📄</span><p>Apresentação de exemplo.pdf</p></div>
        <div class="arquivo"><span>🖼️</span><p>Imagem de exemplo.png</p></div>
        <div class="arquivo"><span>📝</span><p>Anotações.txt</p></div>
      </div>
    </main>
  </div>

  <script>
    function mostrar(nome) {
      document.getElementById('titulo').textContent = nome;
    }

    document.getElementById('busca').addEventListener('input', function() {
      const termo = this.value.toLowerCase();
      document.querySelectorAll('.arquivo').forEach(function(item) {
        item.style.display = item.textContent.toLowerCase().includes(termo)
          ? ''
          : 'none';
      });
    });
  </script>
</body>
</html>
